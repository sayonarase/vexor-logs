name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: python syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vexor-logs targets Python 3.12 (matches vexor-api CI and the
        # production server). shipper_router.py uses PEP 701 f-strings
        # (nested same-quote), which are 3.12+ only by design.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the log API package
        # compileall checks syntax without importing, so the `from app ...`
        # references into vexor-api (a runtime Requires, not vendored here)
        # do not need to resolve.
        run: python -m compileall -q api/vexor_logs_api

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax) on shell scripts
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "checking $f"
            bash -n "$f" || fail=1
          done < <(find . -name '*.sh' -not -path './ui/node_modules/*' -print0)
          exit $fail

  build-inputs:
    name: units the build actually installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on systemd units no spec installs
        # A unit committed outside rpm/SOURCES is read by nothing: editing it
        # looks like it works and silently changes nothing. A duplicate set
        # under systemd/ drifted this way and ended up pointing fluent-bit at
        # a binary path that does not exist.
        run: |
          fail=0
          for f in $(git ls-files '*.service' '*.timer'); do
            case "$f" in
              rpm/SOURCES/*) continue ;;
            esac
            echo "$f is a unit no spec installs (units belong in rpm/SOURCES/)"
            fail=1
          done
          exit $fail
