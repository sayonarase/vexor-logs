# Vexor Logs default Fluent Bit configuration.
# Reads /etc/vexor/logs.env for the VictoriaLogs endpoint and host metadata.
#
# Fluent Bit is the alternative log shipper; vexor-vector is the default.
# The fluent-bit binary itself comes from EPEL, which installs it as
# /usr/bin/fluent-bit with its parser definitions in /etc/fluent-bit.
[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /etc/fluent-bit/parsers.conf

[INPUT]
    Name   tail
    Path   /var/log/messages,/var/log/secure
    Tag    host.*
    Refresh_Interval 5
    DB     /var/lib/vexor-fluentbit/tail.db
    Skip_Long_Lines On

[INPUT]
    Name   systemd
    Tag    journald.*
    Read_From_Tail On

[FILTER]
    Name   modify
    Match  *
    Add    host ${HOSTNAME}

# VictoriaLogs looks for the log text in a field named _msg. The tail input
# calls it "log" and the systemd input calls it "MESSAGE", so normalise both to
# a single field and tell VictoriaLogs to read it (see Uri below). Without this
# every line shows up as "missing _msg field" instead of the actual message.
[FILTER]
    Name   modify
    Match  host.*
    Rename log message

[FILTER]
    Name   modify
    Match  journald.*
    Rename MESSAGE message

[OUTPUT]
    Name   loki
    Match  *
    Host   ${VEXOR_LOGS_HOST}
    Port   ${VEXOR_LOGS_PORT}
    # VictoriaLogs serves the Loki push API under /insert, not at the bare
    # /loki/api/v1/push that Fluent Bit defaults to. Without this every batch
    # is rejected with "unsupported path requested".
    Uri    /insert/loki/api/v1/push?_msg_field=message
    Labels job=fluentbit, host=$host
    Auto_Kubernetes_Labels off
